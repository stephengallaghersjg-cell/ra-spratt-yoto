name: Build R.A. Spratt feeds
on:
  push:
    branches: [main]
    paths:
      - build_feeds.py
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 4'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_feeds.py
      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds FEEDS.md
          git diff --cached --quiet || git commit -m "Update R.A. Spratt Yoto feeds"
          git push
